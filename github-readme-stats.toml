[time]
timezone = "+08:00"

[repos]
pinned = [
    "NVIDIA/TensorRT-LLM",
    "tile-ai/tilelang",
    "govctl-org/govctl",
    "govctl-org/skillc",
    "pku-typst/pkuthss-typst",
    "pku-typst/citeproc-typst",
